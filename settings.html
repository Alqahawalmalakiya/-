<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات - نظام الفواتير</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-nav">
    <h1>نظام الفواتير الاحترافي</h1>
    <div class="nav-links">
      <a href="index.html">الفاتورة</a>
      <a href="settings.html" class="active">الإعدادات ⚙️</a>
    </div>
  </header>

  <div class="main-container" style="max-width: 800px;">
    <aside class="form-section" style="width: 100%;">
      <h2>إعدادات المؤسسة والقالب</h2>
      <form id="settingsForm">
        
        <div class="form-group">
          <label for="companyName">اسم المؤسسة:</label>
          <input type="text" id="companyName" placeholder="مثال: ضيافة القهوة الملكية للحفلات">
        </div>

        <div class="form-group">
          <label for="companyPhone">رقم الجوال العلوي:</label>
          <input type="text" id="companyPhone" placeholder="مثال: ">
        </div>

        <div class="form-group">
          <label for="templateUrl">رابط صورة القالب (الخلفية):</label>
          <input type="url" id="templateUrl" value="https://os.md/NYET.webp">
        </div>

        <div class="form-group">
          <label for="lastInvoiceNum">آخر رقم فاتورة تم استخدامه:</label>
          <input type="number" id="lastInvoiceNum">
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 15px;">💾 حفظ الإعدادات</button>
        <div id="saveMsg" style="color: green; margin-top: 10px; display: none;">تم حفظ الإعدادات بنجاح!</div>
      </form>
    </aside>
  </div>

  <script src="settings.js"></script>
</body>
</html>
